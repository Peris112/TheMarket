 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction Page - Pinnacle</title>
    <link rel="stylesheet" href="trans.css">
    <script src="bootstrap/js/bootstrap.min.js"></script>
    <link rel="stylesheet" href="bootstrap/js/css/bootstrap.min.css">
 </head>
 <body>
    <section id="service-selection-page" class="service-selection hidden">
            <div class="container">
                <div class="back-btn">
                    <button id="back-to-services" class="btn btn-outline">
                        <i class="fas fa-arrow-left"></i> Back to Services
                    </button>
                </div>
                
                <div class="form-header">
                    <h2>Select a Service</h2>
                    <p>Choose the financial service you'd like to access</p>
                </div>
                
                <div class="service-options">
                    <div class="service-option" data-service="withdrawal">
                        <i class="fas fa-money-bill-wave"></i>
                        <h3> <a href="">Withdrawal</a> </h3>
                        <p>Withdraw funds from your account</p>
                    </div>
                    
                    <div class="service-option" data-service="deposit">
                        <i class="fas fa-piggy-bank"></i>
                        <h3><a href="">Deposit</a> </h3>
                        <p>Deposit funds into your account</p>
                    </div>
                    
                    <div class="service-option" data-service="balance">
                        <i class="fas fa-balance-scale"></i>
                        <h3><a href="">Check Balance</a> </h3>
                        <p>View your current account balance</p>
                    </div>
                    
                    <div class="service-option" data-service="loan">
                        <i class="fas fa-hand-holding-usd"></i>
                        <h3> <a href="">Apply for Loan</a> </h3>
                        <p>Submit a loan application</p>
                    </div>
                </div>
            </div>
        </section>

    
 </body>
 </html>
